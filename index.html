<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ОБЗР: Случайные ЧС</title>
    <style>
        :root {
            --primary-color: #d9534f;
            --secondary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #5cb85c;
            --wrong-color: #d9534f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .scenario {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #fff5f5;
        }

        .btn:disabled {
            cursor: not-allowed;
        }

        .btn.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
        }

        .btn.wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
            color: #721c24;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e9ecef;
            display: none;
            font-size: 15px;
            line-height: 1.4;
        }

        .next-btn, .restart-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .next-btn:hover, .restart-btn:hover {
            opacity: 0.9;
        }

        .hide {
            display: none;
        }

        .results {
            text-align: center;
        }

        .score-text {
            font-size: 22px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 Тренажер ОБЗР: Симулятор ЧС</h1>

    <div id="quiz-screen">
        <div class="stats-bar">
            <span id="question-count">Вопрос 1 из 5</span>
            <span id="score-count">Баллы: 0</span>
        </div>

        <div id="scenario" class="scenario">Текст симуляции ЧС...</div>

        <div id="options" class="options"></div>

        <div id="explanation" class="explanation"></div>

        <button id="next-btn" class="next-btn hide" onclick="nextQuestion()">Следующая ситуация</button>
    </div>

    <div id="result-screen" class="results hide">
        <h2>Симуляция завершена!</h2>
        <div class="score-text" id="final-score">Ваш результат: 0/5</div>
        <p id="feedback-text"></p>
        <button class="restart-btn" onclick="restartQuiz()">Начать новую симуляцию (другие вопросы)</button>
    </div>
</div>

<script>
    // База вопросов (здесь можно добавлять сколько угодно)
const allQuestions = [
    // 1–20: ПЕРВАЯ ПОМОЩЬ И МЕДИЦИНА
    { scenario: "У пострадавшего артериальное кровотечение (алая пульсирующая кровь). Ваши действия?", options: ["Наложить тугую повязку на рану", "Наложить жгут выше раны, указав время", "Промыть рану водой и смазать йодом"], correct: 1, explanation: "При артериальном кровотечении пережимают артерию выше раны и накладывают жгут." },
    { scenario: "Человек без сознания, пульса и дыхания нет. С чего начать помощь?", options: ["СЛР (30 нажатий / 2 вдоха)", "Дать понюхать нашатырь", "Похлопать по щекам и полить водой"], correct: 0, explanation: "Клиническая смерть требует немедленной сердечно-легочной реанимации (30:2)." },
    { scenario: "Термический ожог кисти II степени (пузыри). Что сделать?", options: ["Вскрыть пузыри и намазать маслом", "Охлаждать водой 10-15 минут, затем наложить сухую повязку", "Приложить лед прямо к коже"], correct: 1, explanation: "Охлаждение водой останавливает разрушение тканей. Прокалывать пузыри и мазать жиром запрещено." },
    { scenario: "Человек подавился и не может кашлять/дышать. Ваши действия?", options: ["Постучать по спине в стоячем положении", "Применить прием Геймлиха (толчки в живот)", "Дать запить водой"], correct: 1, explanation: "При полной закупорке дыхательных путей применяется прием Геймлиха." },
    { scenario: "У пострадавшего обморожение пальцев рук. Как помочь?", options: ["Растереть снегом или спиртом", "Опустить в горячую воду", "Наложить теплоизолирующую повязку и дать горячее питье"], correct: 2, explanation: "Растирание снегом травмирует кожу. Отогревание должно быть постепенным." },
    { scenario: "Подозрение на перелом голени. Какова последовательность?", options: ["Попытаться вправить кость", "Иммобилизовать шиной с фиксацией двух смежных суставов", "Заставить дойти до скорой"], correct: 1, explanation: "При переломе необходима фиксация суставов выше и ниже места перелома." },
    { scenario: "Признаки обморока у человека (побледнел, теряет сознание). Что сделать?", options: ["Посадить и запрокинуть голову назад", "Уложить на спину и приподнять ноги на 30 см", "Дать сильное обезболивающее"], correct: 1, explanation: "Чтобы восстановить приток крови к мозгу, нужно уложить человека и приподнять ноги." },
    { scenario: "Венозное кровотечение (темная кровь вытекает непрерывно). Что делать?", options: ["Наложить жгут выше раны", "Наложить давящую повязку прямо на рану", "Засыпать рану солью"], correct: 1, explanation: "При венозном кровотечении достаточно давящей повязки на место ранения." },
    { scenario: "У пострадавшего признак травмы позвоночника. Что делать до приезда скорой?", options: ["Посадить его в удобное кресло", "Оставить лежать на твердой ровной поверхности, не перемещать", "Перенести на мягкий диван"], correct: 1, explanation: "Любое перемещение при травме позвоночника может вызвать повреждение спинного мозга." },
    { scenario: "В глаза попала химическая жидкость (щелочь или кислота). Первая помощь?", options: ["Протереть сухой салфеткой", "Промывать обильным количеством проточной воды 15–20 минут", "Закапать глазные капли"], correct: 1, explanation: "Химикаты смываются только долгой промывкой проточной водой." },
    { scenario: "Пострадавший получил солнечный / тепловой удар. Ваши действия?", options: ["Перенести в тень/прохладу, расстегнуть одежду, дать воды и приложить холод", "Дать горячий чай", "Заставить бежать на свежем воздухе"], correct: 0, explanation: "Необходимо быстро охладить организм и восполнить потерю жидкости." },
    { scenario: "Из раны торчит инородное тело (нож, осколок). Что делать?", options: ["Вытащить предмет и забинтовать", "Зафиксировать предмет валиками из бинта, не вынимая его", "Протолкнуть глубже"], correct: 1, explanation: "Вынимать предмет нельзя — он сдерживает кровотечение. Его фиксируют на месте." },
    { scenario: "У человека эпилептический приступ (судороги). Что нельзя делать?", options: ["Заталкивать предметы в рот или разжимать зубы", "Подложить под голову мягкое", "Повернуть человека на бок после приступа"], correct: 0, explanation: "Нельзя силовыми методами разжимать зубы — это приводит к травмам зубов и челюсти." },
    { scenario: "Человека укусила ядовитая змея. Чего ДЕЛАТЬ НЕЛЬЗЯ?", options: ["Зафиксировать конечность и пить много воды", "Разрезать место укуса, прижигать или накладывать жгут", "Доставить в больницу"], correct: 1, explanation: "Разрезы и жгуты при укусе змеи усугубляют некроз тканей." },
    { scenario: "Сильное носовое кровотечение. Как правильно сидеть?", options: ["Запрокинуть голову назад", "Наклонить голову слегка вперед и прижать крылья носа", "Лечь на спину"], correct: 1, explanation: "При запрокидывании головы кровь стекает в пищевод и дыхательные пути." },
    { scenario: "Травма головы, пострадавший без сознания, но дышит. Какое положение придать?", options: ["На спине с запрокинутой головой", "Устойчивое боковое положение", "Сидя"], correct: 1, explanation: "Боковое положение предотвращает западение языка и захлебывание рвотными массами." },
    { scenario: "Ожог от химической кислоты. Как нейтрализовать остатки после промывки водой?", options: ["Слабым раствором питьевой соды", "Уксусом", "Растительным маслом"], correct: 0, explanation: "Кислоту нейтрализуют weak щелочным раствором (содой)." },
    { scenario: "Ожог щелочью. Чем промыть после воды?", options: ["Слабым раствором лимонной/уксусной кислоты", "Раствором соды", "Спиртом"], correct: 0, explanation: "Щелочь нейтрализуют слабой кислотой (уксус, лимонная кислота)." },
    { scenario: "Подозрение на закрытый перелом руки. Что использовать для шины при отсутствии медицинских средств?", options: ["Доску, плотный картон или ветку", "Мягкую подушку", "Гибкий шланг"], correct: 0, explanation: "Шина должна быть жесткой для надежной фиксации." },
    { scenario: "Сколько по времени можно держать кровоостанавливающий жгут летом?", options: ["Не более 1 часа", "Не более 3 часов", "До прибытия врача без ограничений"], correct: 0, explanation: "Летом жгут накладывают максимум на 1 час (зимой — до 30 минут)." },

    // 21–40: ПОЖАРНАЯ БЕЗОПАСНОСТЬ
    { scenario: "Загорелось масло на сковороде. Чем тушить?", options: ["Залить водой", "Накрыть плотной крышкой или противнем", "Засыпать сахарным песком"], correct: 1, explanation: "Вода вызовет вспышку и разбрызгивание масла. Нужно перекрыть доступ кислорода." },
    { scenario: "Горит включенный в розетку телевизор. Первое действие?", options: ["Залить водой", "Обесточить (выдернуть шнур или выключить автомат)", "Накрыть одеялом"], correct: 1, explanation: "Тушить водой или накрывать электроприбор под напряжением смертельно опасно." },
    { scenario: "Задымление в подъезде. Дверь вашей квартиры горячая. Что делать?", options: ["Выбежать в подъезд", "Остаться дома, загерметизировать дверь мокрыми тряпками и ждать спасателей", "Спуститься по лифту"], correct: 1, explanation: "Горячая дверь указывает на очаг пожара снаружи. Подъезд задымлен, выходить нельзя." },
    { scenario: "В помещении много дыма. Как передвигаться к выходу?", options: ["Во весь рост, затаив дыхание", "Пригнувшись или ползком, закрыв нос и рот влажной тканью", "Бегом, широко открыв рот"], correct: 1, explanation: "Дым поднимается к потолку, у пола остается слой чистого воздуха." },
    { scenario: "Какой огнетушитель нельзя использовать для тушения электроустановок под напряжением?", options: ["Углекислотный", "Порошковый", "Воздушно-пенный"], correct: 2, explanation: "Пена содержит воду и проводит электрический ток." },
    { scenario: "На человеке загорелась одежда. Что делать?", options: ["Заставить его бежать, чтобы сбить пламя", "Повалить на землю и накрыть плотной тканью/покатать по земле", "Поливать духовкой"], correct: 1, explanation: "Бег усиливает горение. Нужно сбить пламя перекрытием воздуха." },
    { scenario: "При эвакуации из горящего здания можно ли использовать лифт?", options: ["Да, это быстрее", "Категорически запрещено", "Только если нет дыма"], correct: 1, explanation: "При пожаре лифты обесточиваются и становятся ловушкой." },
    { scenario: "Что делать, если загорелся тостер на кухне?", options: ["Выдернуть вилку из розетки и накрыть плотной тканью", "Залить водой из стакана", "Махать на него полотенцем"], correct: 0, explanation: "Сначала обесточиваем прибор, затем перекрываем воздух." },
    { scenario: "Загорелась сухая трава возле дома. Чем тушить небольшой очаг?", options: ["Сбивать пламя ветками, засыпать землей или залить водой", "Дуть на огонь", "Ждать дождя"], correct: 0, explanation: "Засыпание землей и захлестывание — базовые способы тушения травы." },
    { scenario: "Запах газа в квартире. Первое действие?", options: ["Включить свет и найти утечку", "Перекрыть кран подачи газа, открыть окна, не включать электроприборы", "Зажечь спичку"], correct: 1, explanation: "Любая искра (даже от выключателя) может вызвать взрыв газа." },
    { scenario: "Какая основная причина гибели людей при пожарах в зданиях?", options: ["Прямое воздействие огня", "Отравление токсичными продуктами горения (дымом)", "Падение предметов"], correct: 1, explanation: "Более 80% гибелей происходит от отравления угарным газом." },
    { scenario: "Что означает буквенное обозначение «АВСЕ» на огнетушителе?", options: ["Классы пожаров, которые им можно тушить", "Срок годности", "Фирма-производитель"], correct: 0, explanation: "Буквы указывают на типы горючих веществ (твердые, жидкие, газообразные, электроустановки)." },
    { scenario: "Вы увидели поджог сухой травы. Куда звонить?", options: ["101 или 112", "102", "103"], correct: 0, explanation: "101 — пожарно-спасательная служба, 112 — единый номер ЧС." },
    { scenario: "Если при пожаре путь к выходу отрезан, а вы на 5 этаже?", options: ["Прыгать в окно", "Выйти на балкон, плотно закрыть за собой дверь и звать на помощь", "Спрятаться в шкаф"], correct: 1, explanation: "Прыжок с 5 этажа смертелен. На балконе больше шансов дождаться помощи." },
    { scenario: "Как проверить, не нагрелась ли дверь за которой возможен пожар?", options: ["Прикоснуться ладонью", "Осторожно тыльной стороной ладони", "Открыть на 5 см"], correct: 1, explanation: "Тыльная сторона кисти менее чувствительна к ожогам и позволит быстро отдернуть руку." },
    { scenario: "Чем опасен угарный газ (CO)?", options: ["Имеет едкий запах", "Не имеет цвета и запаха, блокирует перенос кислорода кровью", "Вызывает мгновенный ожог кожи"], correct: 1, explanation: "Угарный газ незаметен и приводит к потере сознания за считанные минуты." },
    { scenario: "Что делать с тугодумным проветриванием при пожаре?", options: ["Распахнуть все окна для свежего воздуха", "Закрыть окна и двери, чтобы не создавать приток кислорода", "Включить вентилятор"], correct: 1, explanation: "Кислород усиливает горение. Окна открывать нельзя." },
    { scenario: "Порошковый огнетушитель применяется для...", options: ["Тушения практически всех типов пожаров", "Только для тушения металлов", "Только для тушения бумаги"], correct: 0, explanation: "Порошковые огнетушители являются универсальными (АВCE)." },
    { scenario: "В лесу загорелась ваша палатка. Действия?", options: ["Выскочить из палатки и тушить её снаружи землей/водой", "Пытаться спасти вещи внутри", "Залезть под спальник"], correct: 0, explanation: "Синтетические палатки сгорают за секунды, нужно мгновенно покинуть её." },
    { scenario: "Для чего нужен пожарный извещатель в квартире?", options: ["Подает воду при пожаре", "Издает громкий звук при появлении дыма", "Автоматически вызывает МЧС"], correct: 1, explanation: "Автономный извещатель реагирует на дым и будит людей ночью." },

    // 41–60: ЧИХИЧЕСКИЕ И РАДИАЦИОННЫЕ АВАРИИ (АХОВ)
    { scenario: "Авария с выбросом аммиака. В какую сторону эвакуироваться?", options: ["Спускаться в подвал", "На верхние этажи здания", "Лечь на землю"], correct: 0, explanation: "Аммиак легче воздуха и поднимается вверх. Прятаться нужно внизу." },
    { scenario: "Авария с выбросом хлора. Где укрыться?", options: ["Спуститься в подвал", "Подняться на верхние этажи", "Оставаться в низине"], correct: 1, explanation: "Хлор тяжелее воздуха, он скапливается в низинах и подвалах." },
    { scenario: "Запах ртути/разбился градусник. Как собирать шарики ртути?", options: ["Пылесосом", "Веником", "Листом бумаги, скотчем или кисточкой в банку с водой"], correct: 2, explanation: "Пылесос распылит ртуть. Ее собирают мокрой бумагой/скотчем." },
    { scenario: "Поступил сигнал «Радиационная опасность». Первое действие дома?", options: ["Бежать на улицу", "Загерметизировать окна, двери, вентиляцию, сделать запас воды", "Открыть все окна"], correct: 1, explanation: "Нужно защитить помещение от попадания радиоактивной пыли." },
    { scenario: "Чем смочить ватно-марлевую повязку для защиты от аммиака?", options: ["Водой или 2% раствором лимонной/уксусной кислоты", "Раствором соды", "Спиртом"], correct: 0, explanation: "Аммиак — щелочной газ, нейтрализуется слабой кислотой." },

    let currentQuizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Функция для перемешивания массива (Алгоритм Фишера-Йейтса)
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startQuiz() {
        // Перемешиваем все вопросы и берем первые 5
        const shuffled = shuffleArray([...allQuestions]);
        currentQuizQuestions = shuffled.slice(0, 5); 

        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('result-screen').classList.add('hide');
        document.getElementById('quiz-screen').classList.remove('hide');
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuizQuestions[currentQuestionIndex];
        document.getElementById('question-count').innerText = `Вопрос ${currentQuestionIndex + 1} из 5`;
        document.getElementById('score-count').innerText = `Баллы: ${score}`;
        document.getElementById('scenario').innerText = q.scenario;
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').classList.add('hide');

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.classList.add('btn');
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const q = currentQuizQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.options .btn');

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correct) btn.classList.add('correct');
            if (idx === selectedIndex && selectedIndex !== q.correct) btn.classList.add('wrong');
        });

        if (selectedIndex === q.correct) score++;
        
        document.getElementById('score-count').innerText = `Баллы: ${score}`;
        const exp = document.getElementById('explanation');
        exp.innerText = q.explanation;
        exp.style.display = 'block';

        document.getElementById('next-btn').classList.remove('hide');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuizQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hide');
        document.getElementById('result-screen').classList.remove('hide');
        document.getElementById('final-score').innerText = `Ваш результат: ${score} из 5`;

        let feedback = "";
        if (score === 5) {
            feedback = "Идеально! Ты настоящий эксперт по выживанию.";
        } else if (score >= 3) {
            feedback = "Хороший результат. Базовые знания в норме, но есть куда расти.";
        } else {
            feedback = "Опасно! Стоит срочно повторить правила безопасности.";
        }
        document.getElementById('feedback-text').innerText = feedback;
    }

    function restartQuiz() {
        startQuiz();
    }

    // Запускаем при загрузке страницы
    startQuiz();
</script>

</body>
</html>
